name: CD - Scan Deploy (prod)

on:
  push:
    branches:
      - prod

jobs:

  scan:
    name: "Job 1 - Scan securite avant deploiement"
    runs-on: ubuntu-latest
    steps:
      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image depuis Docker Hub
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Scan Trivy image de production
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0
          ignore-unfixed: true

  deploy:
    name: "Job 2 - Deploiement sur runner_prod port 80"
    runs-on: runner_prod
    needs: scan
    steps:
      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull derniere image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Arreter ancien conteneur
        run: docker stop intranet-newdeal-prod || true && docker rm intranet-newdeal-prod || true

      - name: Demarrer conteneur sur port 80
        run: |
          docker run -d \
            --name intranet-newdeal-prod \
            --restart always \
            -p 80:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Verification conteneur actif
        run: docker ps | grep intranet-newdeal-prod && echo "Deploiement reussi port 80"