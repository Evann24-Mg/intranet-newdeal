name: CI - Build, Scan, Push (dev)

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: intranet-newdeal

jobs:

  build:
    name: Build image Docker nginx:alpine3.23
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Sauvegarde image (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  scan:
    name: Scan securite (vulnerabilites + secrets)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Telecharger image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Charger image Docker
        run: docker load --input /tmp/image.tar

      - name: Scan Trivy - vulnerabilites image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0
          ignore-unfixed: true

      - name: Scan Trivy - secrets dans le code
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: 0

  push:
    name: Push vers Docker Hub
    runs-on: ubuntu-latest
    needs: [build, scan]
    steps:
      - name: Telecharger image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Charger image Docker
        run: docker load --input /tmp/image.tar

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag et push image
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest
          echo "Image pushee avec succes"