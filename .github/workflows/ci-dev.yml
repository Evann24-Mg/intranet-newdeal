name: CI - Build Scan Push (dev)

on:
  push:
    branches:
      - dev

jobs:

  build:
    name: "Job 1 - Build image nginx:alpine3.23"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

  scan:
    name: "Job 2 - Scan securite vulnerabilites et secrets"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image pour scan
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Scan Trivy vulnerabilites image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0
          ignore-unfixed: true

      - name: Scan Trivy secrets dans le code
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: 0

  push:
    name: "Job 3 - Push image vers Docker Hub"
    runs-on: ubuntu-latest
    needs: [build, scan]
    steps:
      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verification image sur Docker Hub
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest
          echo "Image disponible sur Docker Hub"
          docker inspect ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest | grep -i "created"
          echo "Push confirme avec succes"