name: Evolution - Slim CRITICAL Email

on:
  push:
    branches:
      - dev
      - prod

jobs:

  build-slim:
    name: "Build nginx:alpine3.23-slim"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Passer a image slim
        run: sed -i 's|FROM nginx:alpine3.23|FROM nginx:alpine3.23-slim|' Dockerfile

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push image slim
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:slim-latest

  scan-bloquant:
    name: "Scan BLOQUANT si CRITICAL detecte"
    runs-on: ubuntu-latest
    needs: build-slim
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan CRITIQUE bloquant exit-code 1
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:slim-latest
          format: table
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Scan HIGH MEDIUM informatif
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:slim-latest
          format: table
          severity: HIGH,MEDIUM
          exit-code: 0
          ignore-unfixed: true

  notify:
    name: "Notification email succes ou echec"
    runs-on: ubuntu-latest
    needs: [build-slim, scan-bloquant]
    if: always()
    steps:
      - name: Envoi email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Pipeline Intranet NewDeal - Run ${{ github.run_number }}"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: "CI/CD NewDeal <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Pipeline GitHub Actions termine.
            Branche  : ${{ github.ref_name }}
            Commit   : ${{ github.sha }}
            Auteur   : ${{ github.actor }}
            Run      : ${{ github.run_number }}
            Lien     : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}